<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>Offline - AGT Todo</title>
    <link rel="icon" href="/assets/icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: #1e1e2f;
            color: #eeeeee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .card {
            max-width: 420px;
            background: #2a2a3b;
            border: 1px solid #3a3a4a;
            border-radius: 16px;
            padding: 32px 24px;
        }

        img {
            width: 96px;
            height: 96px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        p {
            color: #a0a0a0;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        a,
        button {
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        a.secondary {
            background: transparent;
            border: 1px solid #3a3a4a;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="/assets/icon-192.png" alt="">
        <h1>📡 You're offline</h1>
        <p>This page isn't available offline yet. Your tasks are stored on this device, and alarms that were
            already scheduled will still ring once your phone is back online.</p>
        <div class="actions">
            <button onclick="location.reload()">🔄 Try again</button>
            <a class="secondary" href="/programmable/index.html">⏰ Programmable Todo</a>
            <a class="secondary" href="/classic/index.html">📝 Classic Todo</a>
        </div>
    </div>
</body>

</html>
