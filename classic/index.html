<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Todo - Simple Task Manager</title>
    <link rel="stylesheet" href="../shared/css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <div class="nav-brand">
            <span>📝</span>
            <span>Classic Todo</span>
        </div>
        <div class="nav-buttons">
            <a href="#" class="nav-btn" id="homeBtnClassic">🏠 Home</a>
            <a href="#" class="nav-btn" id="programmableBtnClassic">⏰ Programmable Mode</a>
            <button id="themeToggle" class="theme-toggle">🌙</button>
        </div>
    </nav>

    <script>
        // Navigation functions for Classic Todo
        document.getElementById('homeBtnClassic').addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = '../index.html';
        });

        document.getElementById('programmableBtnClassic').addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = '../programmable/index.html';
        });
    </script>
    <!-- Main Container -->
    <div class="container">
        <!-- Add Task Section -->
        <section class="add-task-section">
            <div class="input-group">
                <input type="text" id="taskInput" class="task-input"
                    placeholder="What needs to be done? (max 120 chars)" maxlength="120" autocomplete="off">
                <button id="addBtn" class="btn btn-primary">
                    + Add
                </button>
            </div>
            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </section>

        <!-- Filter Controls -->
        <section class="filter-section">
            <div class="filter-buttons">
                <button data-filter="all" class="filter-btn active">All</button>
                <button data-filter="active" class="filter-btn">Active</button>
                <button data-filter="completed" class="filter-btn">Completed</button>
            </div>
            <button id="clearCompletedBtn" class="btn btn-secondary">
                Clear Completed
            </button>
        </section>

        <!-- Task List -->
        <section class="task-list-section">
            <ul id="taskList" class="task-list">
                <li class="empty-state">
                    <div class="empty-state-content">
                        <span class="empty-emoji">📭</span>
                        <p>Your todo list is empty</p>
                        <small>Add a task above to get started</small>
                    </div>
                </li>
            </ul>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <span id="remainingCount">0</span> tasks remaining
        </footer>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="image-modal">
        <span class="modal-close">&times;</span>
        <img id="modalImage" class="modal-image" alt="Full size task image">
    </div>

    <script src="../shared/js/utils.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
