<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmable Todo - Smart Task Manager</title>
    <link rel="stylesheet" href="../shared/css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <div class="nav-brand">
            <span>⏰</span>
            <span>Programmable Todo</span>
        </div>
        <div class="nav-buttons">
            <a href="#" class="nav-btn" id="homeBtnProgrammable">🏠 Home</a>
            <a href="#" class="nav-btn" id="classicBtnProgrammable">📝 Classic Mode</a>
            <button id="themeToggle" class="theme-toggle">🌙</button>
        </div>
    </nav>

    <script>
        // Navigation functions for Programmable Todo
        document.getElementById('homeBtnProgrammable').addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = '../index.html';
        });

        document.getElementById('classicBtnProgrammable').addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = '../classic/index.html';
        });
    </script>

    <!-- Main Container -->
    <div class="container">
        <!-- Add Task Section -->
        <section class="add-task-section">
            <h2>📅 Create Smart Task</h2>
            <div class="task-form">
                <input type="text" id="taskTitle" class="task-input" placeholder="Task title *" maxlength="100">

                <textarea id="taskDesc" class="task-textarea" placeholder="Description (optional)" rows="2"
                    maxlength="300"></textarea>

                <div class="form-row">
                    <div class="form-group">
                        <label>📅 Due Date</label>
                        <input type="date" id="dueDate" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>⏰ Due Time</label>
                        <input type="time" id="dueTime" class="form-input">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>🎯 Priority</label>
                        <select id="priority" class="form-input">
                            <option value="low">🟢 Low</option>
                            <option value="medium" selected>🟡 Medium</option>
                            <option value="high">🔴 High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📂 Category</label>
                        <select id="category" class="form-input">
                            <option value="work">💼 Work</option>
                            <option value="personal">🏠 Personal</option>
                            <option value="shopping">🛒 Shopping</option>
                            <option value="health">🏃 Health</option>
                            <option value="other">📌 Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>⏰ Reminder (minutes before)</label>
                        <select id="reminderMinutes" class="form-input">
                            <option value="0">No reminder</option>
                            <option value="5">5 minutes before</option>
                            <option value="10">10 minutes before</option>
                            <option value="15">15 minutes before</option>
                            <option value="30">30 minutes before</option>
                            <option value="60">1 hour before</option>
                        </select>
                    </div>
                </div>

                <button id="addTaskBtn" class="btn btn-primary">+ Add Programmable Task</button>
            </div>
        </section>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat">
                <span class="stat-label">📊 Total</span>
                <span id="totalCount" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">✅ Completed</span>
                <span id="completedCount" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">⏰ Upcoming</span>
                <span id="upcomingCount" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">⚠️ Overdue</span>
                <span id="overdueCount" class="stat-value">0</span>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button data-filter="all" class="tab-btn active">All Tasks</button>
            <button data-filter="upcoming" class="tab-btn">Upcoming</button>
            <button data-filter="overdue" class="tab-btn">Overdue</button>
            <button data-filter="completed" class="tab-btn">Completed</button>
        </div>

        <!-- Task List -->
        <section class="task-list-section">
            <div id="taskList" class="task-list">
                <!-- Tasks will be injected here -->
            </div>
        </section>
    </div>

    <!-- Notification Permission Banner -->
    <div id="notificationBanner" class="notification-banner" style="display: none;">
        <span>🔔 Enable notifications to get reminders for your tasks</span>
        <button id="enableNotificationsBtn" class="btn-small">Enable</button>
        <button id="dismissBannerBtn" class="btn-small btn-secondary">Dismiss</button>
    </div>

    <!-- Debug panel: manual test trigger + next-check countdown -->
    <div id="debugPanel" class="debug-panel">
        <span id="nextCheckIndicator">Next check in 5s</span>
        <button id="testAlarmBtn" class="btn-small">🔔 Test Alarm</button>
    </div>

    <!-- Full-screen Alarm Modal (dismiss only via buttons, not by clicking outside) -->
    <div id="alarmModal" class="alarm-modal">
        <div class="alarm-modal-content">
            <div class="alarm-icon">⏰</div>
            <div id="alarmKindLabel" class="alarm-kind-label">TASK DUE</div>
            <h2 id="alarmTaskTitle" class="alarm-task-title"></h2>
            <p id="alarmTaskDesc" class="alarm-task-desc"></p>
            <div class="alarm-meta">
                <span id="alarmPriority" class="meta-item"></span>
                <span id="alarmCategory" class="meta-item"></span>
                <span id="alarmDueTime" class="meta-item"></span>
            </div>
            <div class="alarm-actions">
                <button id="alarmSnoozeBtn" class="alarm-btn alarm-btn-snooze">🔕 Snooze 5 min</button>
                <button id="alarmCompleteBtn" class="alarm-btn alarm-btn-complete">✅ Complete Task</button>
                <button id="alarmDismissBtn" class="alarm-btn alarm-btn-dismiss">❌ Dismiss</button>
            </div>
        </div>
    </div>

    <script src="../shared/js/utils.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
